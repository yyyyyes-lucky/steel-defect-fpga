<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>钢板缺陷 · 静态对照</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#20282b;background:#f5f6f6;letter-spacing:0}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;background:#fff;border-bottom:1px solid #d9dfe0;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0 0 14px}p{line-height:1.65;margin:8px 0}small,.muted{color:#637177;font-size:12px}.badge{padding:5px 9px;background:#e1f1e9;color:#1b6648;font-size:12px;border-radius:4px}.notice{background:#fff4d5;color:#765200;padding:10px 28px;font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-bottom:1px solid #d9dfe0;padding:20px 28px;gap:24px}.metric{border-right:1px solid #e2e6e6}.metric:last-child{border:0}.metric b{font-size:26px;display:block;margin:7px 0}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 28px;border-bottom:1px solid #d9dfe0;background:#fff}button,select,input{font:inherit}button,select{border:1px solid #bec8ca;border-radius:4px;background:#fff;color:#26363b;padding:8px 10px;min-height:36px}button{cursor:pointer}button:hover{background:#edf2f0}button:disabled{opacity:.4;cursor:default}button.icon{width:36px;padding:6px;display:inline-flex;align-items:center;justify-content:center}button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}label{font-size:13px;display:flex;align-items:center;gap:5px}#search{padding:8px;border:1px solid #bec8ca;border-radius:4px;width:180px;min-width:0}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:600px}aside{border-right:1px solid #d9dfe0;padding:16px;background:#fff}.thumbnails{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:780px;overflow:auto;padding:2px}.thumb{padding:5px;text-align:left;min-width:0;border-color:#d9dfe0}.thumb.selected{border:2px solid #187452;padding:4px;background:#edf7f1}.thumb img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#222}.thumb span{display:block;font-size:11px;overflow-wrap:anywhere;line-height:1.4;margin-top:5px}.main{padding:20px 24px;min-width:0}.frame-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px}.frame-head h2{overflow-wrap:anywhere;max-width:900px}.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}figure{margin:0;min-width:0}figcaption{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:13px;min-height:44px;flex-wrap:wrap}canvas{width:100%;aspect-ratio:1;display:block;background:#191e20}.pending{height:auto;aspect-ratio:1;background:#e7ebea;display:flex;align-items:center;justify-content:center;font-size:14px;color:#637177}.section{padding:22px 0;border-top:1px solid #d9dfe0;margin-top:20px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #dfe5e4;vertical-align:top;overflow-wrap:anywhere}th{color:#637177;font-weight:normal}tbody tr[data-roi]{cursor:pointer}tbody tr[data-roi]:hover,tbody tr.active{background:#e7f2ec}.scroll{overflow:auto}.zooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}.zooms canvas{aspect-ratio:2;height:auto}pre{font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}details{margin-top:14px}summary{cursor:pointer;font-size:13px;color:#166345}.source{font-size:12px;color:#637177}.frame-index{white-space:nowrap}.empty{padding:35px;text-align:center;color:#637177}[hidden]{display:none!important}@media(max-width:1000px){.layout{grid-template-columns:175px minmax(0,1fr)}.thumbnails{grid-template-columns:1fr}.main{padding:16px}.views{gap:8px}.metric b{font-size:22px}}@media(max-width:700px){header{padding:16px;align-items:flex-start}h1{font-size:20px}.metrics{padding:16px;grid-template-columns:1fr 1fr;gap:16px}.metric:nth-child(2){border:0}.toolbar{padding:12px;gap:8px}.layout{display:block}aside{padding:12px;border-right:0;border-bottom:1px solid #d9dfe0}.thumbnails{display:flex;overflow-x:auto;max-height:none}.thumb{flex:0 0 88px}.views,.zooms{grid-template-columns:1fr}.main{padding:14px}.frame-head{gap:8px}.frame-head h2{font-size:14px}.frame-index{font-size:12px}#search{flex:1;width:120px}.scroll table{min-width:560px}figcaption{min-height:36px}.zooms canvas{max-height:240px}}
</style></head><body>
<header><div><h1>钢板缺陷 · 静态对照</h1><div class="source" id="datasetLabel"></div></div><span class="badge" id="runStatus"></span></header>
<div class="notice" id="previewBanner" hidden>Windows 预览 · FPGA 结果及开发板耗时待实测</div>
<div class="metrics"><div class="metric"><small>纯 ARM 后处理 / 帧</small><b id="cpuMean">待实测</b><small>同一开发板 CPU</small></div><div class="metric"><small>FPGA 路径后处理 / 帧</small><b id="fpgaMean">待实测</b><small>包含 DMA 与 ARM 工作</small></div><div class="metric"><small>整批总耗时加速比</small><b id="speedup">待实测</b><small id="reduction"></small></div><div class="metric"><small>存在掩膜差异的 ROI</small><b id="agreement">待实测</b><small id="semantic"></small></div></div>
<div class="toolbar"><select id="classFilter" aria-label="缺陷类别"><option value="all">全部类别</option></select><input id="search" placeholder="图片名称" aria-label="搜索图片"><label><input type="checkbox" id="different">仅显示差异</label><label><input type="checkbox" id="boxes" checked>检测框</label><label><input type="checkbox" id="masks" checked>候选区域</label><span class="muted" id="filterCount"></span></div>
<div class="layout"><aside><div class="thumbnails" id="thumbnails"></div></aside><main class="main"><div class="frame-head"><div><h2 id="imageName"></h2><div class="source" id="frameStatus"></div></div><div style="display:flex;align-items:center;gap:8px"><button class="icon" id="prev" aria-label="上一张" title="上一张"><span aria-hidden="true">←</span></button><span class="frame-index" id="position"></span><button class="icon" id="next" aria-label="下一张" title="下一张"><span aria-hidden="true">→</span></button></div></div>
<div class="empty" id="empty" hidden>没有符合条件的图片</div><div class="views" id="views"><figure><figcaption>原始输入 <small>512 × 512 · 灰度</small></figcaption><canvas id="input" width="512" height="512"></canvas></figure><figure><figcaption>FPGA 后处理 <small id="fpgaTime"></small></figcaption><canvas id="fpga" width="512" height="512"></canvas><div class="pending" id="fpgaPending" hidden>待开发板实测</div></figure><figure><figcaption id="cpuCaption">纯 ARM 软件 <small id="cpuTime"></small></figcaption><canvas id="cpu" width="512" height="512"></canvas></figure></div>
<div class="section"><h2>缺陷结果</h2><div class="scroll"><table><thead><tr><th>类别 / 置信度</th><th>FPGA 区域 / 状态</th><th>软件区域 / 状态</th><th>掩膜差异 / 记录差异</th></tr></thead><tbody id="rows"></tbody></table></div><div class="zooms"><figure><figcaption>原图局部</figcaption><canvas id="zoomInput" width="512" height="256"></canvas></figure><figure><figcaption>FPGA 局部</figcaption><canvas id="zoomFpga" width="512" height="256"></canvas></figure><figure><figcaption>软件局部</figcaption><canvas id="zoomCpu" width="512" height="256"></canvas></figure></div><details><summary>区域数据</summary><pre id="details"></pre></details></div>
<div class="section"><h2>各类图像整帧耗时</h2><div class="scroll"><table><thead><tr><th>图像类别</th><th>图片数</th><th>ARM / 帧</th><th>FPGA / 帧</th><th>总耗时比</th></tr></thead><tbody id="classes"></tbody></table></div><p class="muted" id="rounds"></p><details><summary>测量记录</summary><p class="muted" id="timingScope"></p><p class="muted" id="numeric"></p><p class="muted" id="protocol"></p><p class="muted" id="versions"></p></details></div></main></div>
<script id="evidence" type="application/json">__EVIDENCE_JSON__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('evidence').textContent),report=data.report,preview=report.mode==='host_preview',stats=report.summary,$=id=>document.getElementById(id),names=['裂纹','夹杂','斑块','麻面','氧化皮压入','划痕'],ms=v=>Number(v).toFixed(2)+' ms';
const states={statistics_only:'仅统计',texture_statistics:'纹理统计',needs_review:'需复核',no_automatic_warning:'未触发复核',usable_candidate:'候选区域',shape_candidate:'形态候选',edge_candidate:'边缘候选',uncertain_fragmented:'区域碎片化',uncertain_texture:'纹理不确定'};
$('datasetLabel').textContent=report.frames_expected+' 张 · 六类各 20 张 · 来源：valid 验证集';$('runStatus').textContent=preview?'实测待完成':'开发板实测完成';$('previewBanner').hidden=!preview;$('different').disabled=preview;
if(preview){$('cpuCaption').firstChild.textContent='Windows 算法预览 ';$('fpga').hidden=true;$('fpgaPending').hidden=false}
else{$('cpuMean').textContent=ms(stats.timings_ms.cpu.mean);$('fpgaMean').textContent=ms(stats.timings_ms.fpga.mean);$('speedup').textContent=stats.speedup.toFixed(3)+'×';$('reduction').textContent='耗时减少 '+stats.time_reduction_pct.toFixed(2)+'%';$('agreement').textContent=report.agreement.mask_rois_different+' / '+report.agreement.rois;$('semantic').textContent='共 '+report.agreement.mask_different_pixels+' 个像素差异';$('rounds').textContent=stats.per_round.map((r,i)=>'第 '+(i+1)+' 轮 '+r.speedup.toFixed(3)+'×').join(' · ')}
if(report.test_fixture){$('previewBanner').hidden=false;$('previewBanner').textContent='界面测试数据 · 合成耗时，非开发板实测';$('runStatus').textContent='界面测试'}
for(let i=0;i<6;i++){const o=document.createElement('option');o.value=i;o.textContent=names[i];$('classFilter').append(o);const tr=document.createElement('tr'),s=stats?.source_classes?.find(x=>x.class_id===i);for(const t of [names[i],data.frames.filter(f=>f.source.source_class_id===i).length,s?ms(s.cpu_ms):'待实测',s?ms(s.fpga_ms):'待实测',s?s.speedup.toFixed(3)+'×':'待实测']){const td=document.createElement('td');td.textContent=t;tr.append(td)}$('classes').append(tr)}
$('timingScope').textContent='同一开发板、同一灰度输入与冻结 YOLO 检测框。后处理计时包含数据准备、DMA、缓存维护、等待、解码及 ARM 工作；不含 YOLO、网络、加载和保存。加速比按整批总耗时计算。';$('numeric').textContent='叠加区域为算法候选区域或粗分割；裂纹、麻面仅显示检测框和统计，不生成掩膜。浮点与定点计算可能有阈值边界差异，逐项保留；无分割真值，不报告像素精度。';$('protocol').textContent=preview?'当前为本机算法预览，未运行 ARM / FPGA 性能对照。':'两轮按相反顺序配对测量，保留未检出和慢帧。类别按图片来源分组，包含整帧共享计算。';$('versions').textContent=report.mask_revision||'';
let visible=[],current=null,images=null,generation=0,roiIndex=0;
const thumbLabel=f=>f.source.image_name.split('_jpg')[0];
function options(){const chosen=current?.case;visible=data.frames.filter(f=>($('classFilter').value==='all'||f.source.source_class_id===Number($('classFilter').value))&&f.source.image_name.toLowerCase().includes($('search').value.toLowerCase())&&(!$('different').checked||!f.audit.exact));$('filterCount').textContent=visible.length+' 张';$('thumbnails').replaceChildren();for(const f of visible){const b=document.createElement('button');b.className='thumb';b.dataset.case=f.case;b.title=f.source.image_name;const im=document.createElement('img');im.src='data:image/png;base64,'+f.input_png;im.alt=thumbLabel(f);im.loading='lazy';const label=document.createElement('span');label.textContent=thumbLabel(f);b.append(im,label);b.onclick=()=>show(f.case);$('thumbnails').append(b)}show(visible.find(f=>f.case===chosen)?.case||visible[0]?.case)}
function image(b64){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src='data:image/png;base64,'+b64})}
function paint(canvas,over){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,512,512);ctx.drawImage(images.input,0,0);if(over&&$('masks').checked)ctx.drawImage(over,0,0);if(over&&$('boxes').checked){ctx.lineWidth=2;ctx.strokeStyle='#4df5ad';ctx.fillStyle='#4df5ad';ctx.font='13px sans-serif';for(const p of current.predictions){const[x,y,x2,y2]=p.box_xyxy_pixel;ctx.strokeRect(x,y,x2-x,y2-y);ctx.fillText('#'+(p.detection_index+1)+' '+names[p.class_id]+' '+Math.round(p.confidence*100)+'%',Math.min(x,350),Math.max(y-5,16))}}}
function zoom(i){roiIndex=i;const f=current,r=f?.cpu.records[i];for(const v of ['Input','Fpga','Cpu']){const ctx=$('zoom'+v).getContext('2d');ctx.clearRect(0,0,512,256);if(!r||(v==='Fpga'&&!f.fpga))continue;const[x,y,x2,y2]=r.roi_xyxy_pixel,w=x2-x,h=y2-y,scale=Math.min(512/w,256/h);ctx.drawImage($(v.toLowerCase()),x,y,w,h,(512-w*scale)/2,(256-h*scale)/2,w*scale,h*scale)}$('details').textContent=r?JSON.stringify({software:r,fpga:f.fpga?.records[i]||null,differences:f.audit?.rois[i]||null},null,2):'';document.querySelectorAll('[data-roi]').forEach(el=>el.classList.toggle('active',Number(el.dataset.roi)===i))}
function redraw(){if(!current||!images)return;paint($('input'),null);paint($('cpu'),images.cpu);if(current.fpga)paint($('fpga'),images.fpga);zoom(roiIndex)}
async function show(name){const ticket=++generation;current=null;images=null;$('rows').replaceChildren();$('details').textContent='';for(const id of ['input','cpu','fpga','zoomInput','zoomCpu','zoomFpga'])$(id).getContext('2d').clearRect(0,0,512,512);const f=visible.find(f=>f.case===name);$('empty').hidden=!!f;$('views').hidden=!f;$('imageName').textContent=f?f.source.image_name:'';$('position').textContent=f?(visible.indexOf(f)+1)+' / '+visible.length:'0 / 0';$('frameStatus').textContent='';$('cpuTime').textContent='';$('fpgaTime').textContent='';$('prev').disabled=$('next').disabled=!f;document.querySelectorAll('.thumb').forEach(b=>b.classList.toggle('selected',b.dataset.case===name));if(!f)return;try{const loaded=await Promise.all([image(f.input_png),image(f.cpu.overlay_png),f.fpga?image(f.fpga.overlay_png):Promise.resolve(null)]);if(ticket!==generation)return;current=f;images={input:loaded[0],cpu:loaded[1],fpga:loaded[2]};const t=stats?.per_case.find(x=>x.case===f.case);$('cpuTime').textContent=t?ms(t.cpu):'';$('fpgaTime').textContent=t?ms(t.fpga)+' · '+t.speedup.toFixed(2)+'×':'';$('frameStatus').textContent=f.predictions.length?(names[f.source.source_class_id]+' · '+f.predictions.length+' 个检测框'+(f.audit?' · 掩膜差异 '+f.audit.rois.reduce((s,r)=>s+Object.values(r.mask_different_pixels).reduce((a,b)=>a+b,0),0)+' px':'')):'未检出缺陷';for(let i=0;i<f.cpu.records.length;i++){const a=f.cpu.records[i],b=f.fpga?.records[i],check=f.audit?.rois[i],row=document.createElement('tr');row.dataset.roi=i;const value=r=>r?(r.candidate?.candidate_pixels==null?'仅统计':r.candidate.candidate_pixels+' px')+' / '+(states[r.branch_state]||r.branch_state):'待实测';for(const text of [names[a.class_id]+' '+(a.confidence*100).toFixed(1)+'%',value(b),value(a),check?Object.values(check.mask_different_pixels).reduce((s,n)=>s+n,0)+' px / '+check.changed_fields.length+' 项':'待实测']){const td=document.createElement('td');td.textContent=text;row.append(td)}row.onclick=()=>zoom(i);$('rows').append(row)}roiIndex=0;redraw();document.body.dataset.renderedCase=f.case}catch(e){if(ticket===generation){$('frameStatus').textContent='图像载入失败';console.error(e)}}}
function step(d){if(visible.length)show(visible[(Math.max(0,visible.findIndex(f=>f.case===current?.case))+d+visible.length)%visible.length].case)}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('classFilter').onchange=options;$('different').onchange=options;$('search').oninput=options;$('boxes').onchange=redraw;$('masks').onchange=redraw;options();
</script></body></html>
